name: Docker

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # github.repository is "mkm29/uds-headlamp-plugin" (already lowercase, GHCR-safe).
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-push:
    name: build & push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # GitHub artifact attestations (OIDC, keyless signing)
      attestations: write # write build-provenance + SBOM attestations
    steps:
      - uses: actions/checkout@v4

      # QEMU enables the linux/arm64 build on the amd64 runner.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Do not log in (and do not push) on pull_request builds from forks.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=pr
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/develop' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # Push on main/tags/dispatch; PRs build only (verify the Dockerfile).
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Empty -> plugin falls back to its runtime namespace resolution.
          # Cluster-specific inlining stays a deploy-time concern (see tasks.yaml).
          build-args: |
            CANDIDATE_NAMESPACES=
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          # Do NOT push a buildkit inline SBOM attestation: on the FIRST push of a
          # new GHCR package it 403s while the package is being created. The SBOM is
          # generated and attested separately below, after the image exists.
          sbom: false

      # Signed SLSA build-provenance attestation pushed to the registry. Keyless
      # via the workflow OIDC token; verify with `gh attestation verify`. Replaces
      # the previous cosign step (same Sigstore-backed signing, GitHub-native).
      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Generate SBOM (CycloneDX)
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-cyclonedx.json
          artifact-name: sbom-cyclonedx.json

      # Signed SBOM attestation pushed to the registry.
      - name: Attest SBOM
        if: github.event_name != 'pull_request'
        uses: actions/attest-sbom@v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom-cyclonedx.json
          push-to-registry: true
