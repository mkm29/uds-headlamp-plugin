name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # github.repository is "mkm29/uds-headlamp-plugin" (already lowercase, GHCR-safe).
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-push:
    name: build & push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # cosign keyless (OIDC) signing
      attestations: write
    steps:
      - uses: actions/checkout@v4

      # QEMU enables the linux/arm64 build on the amd64 runner.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Do not log in (and do not push) on pull_request builds from forks.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=pr
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # Push on main/tags/dispatch; PRs build only (verify the Dockerfile).
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Empty -> plugin falls back to its runtime namespace resolution.
          # Cluster-specific inlining stays a deploy-time concern (see tasks.yaml).
          build-args: |
            CANDIDATE_NAMESPACES=
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # SBOM + provenance attestations (buildkit/Syft) attached to the image
          # in-registry — satisfies ADR-0006's SBOM requirement.
          sbom: true
          provenance: mode=max

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      # Sign the pushed image by digest (covers every tag and both platforms of
      # the multi-arch index). Keyless: identity comes from the workflow's OIDC
      # token, signature + cert logged to the Rekor transparency log.
      - name: Sign image (keyless)
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
