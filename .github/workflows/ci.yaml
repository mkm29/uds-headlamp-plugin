name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # lint / tsc / test run as one matrix so a red check names the exact stage
  # (e.g. "checks (tsc)") while keeping the YAML DRY.
  checks:
    name: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [lint, tsc, test]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: bun run ${{ matrix.task }}
        run: bun run ${{ matrix.task }}
        env:
          CI: "true"

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: bun run build
        run: bun run build

      # headlamp-plugin build emits dist/main.js + package.json; ship both so the
      # artifact is a directly-mountable plugin dir (see Dockerfile rationale).
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-dist
          path: |
            dist/
            package.json
          if-no-files-found: error
          retention-days: 7
