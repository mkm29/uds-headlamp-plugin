name: CI
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
# Pin Bun so installs are reproducible and the dependency-cache key changes on
# a Bun upgrade. Single source of truth for the version + the cache key.
env:
  BUN_VERSION: "1.3.14"
jobs:
  # lint / tsc / test run as one matrix so a red check names the exact stage
  # (e.g. "checks (tsc)") while keeping the YAML DRY.
  checks:
    name: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [lint, tsc, test]
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # setup-bun caches only the Bun binary; this caches the dependency install
      # cache (~/.bun/install/cache) -- a different path, so the two are not
      # redundant. Key includes the Bun version + the lockfile hash so it
      # invalidates on either change; restore-keys gives partial warmth.
      - name: Cache bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ env.BUN_VERSION }}-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            bun-${{ env.BUN_VERSION }}-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: bun run ${{ matrix.task }}
        run: bun run ${{ matrix.task }}
        env:
          CI: "true"
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # setup-bun caches only the Bun binary; this caches the dependency install
      # cache (~/.bun/install/cache) -- a different path, so the two are not
      # redundant. Key includes the Bun version + the lockfile hash so it
      # invalidates on either change; restore-keys gives partial warmth.
      - name: Cache bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ env.BUN_VERSION }}-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            bun-${{ env.BUN_VERSION }}-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: bun run build
        run: bun run build
      # headlamp-plugin build emits dist/main.js + package.json; ship both so the
      # artifact is a directly-mountable plugin dir (see Dockerfile rationale).
      - name: Upload dist artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: plugin-dist
          path: |
            dist/
            package.json
          if-no-files-found: error
          retention-days: 7
