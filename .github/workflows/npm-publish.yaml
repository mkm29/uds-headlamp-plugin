name: Publish npm package
on:
  # Release-only: publish exclusively on a version tag (v*), matching docker.yaml.
  # Release tags are cut from main by release-please, so this is the "publish on
  # release" trigger. Note: a tag created with the default GITHUB_TOKEN does NOT
  # start workflow runs, so this fires only when the tag is pushed by a PAT
  # (RELEASE_PLEASE_TOKEN) or manually -- same caveat as docker.yaml.
  push:
    tags: ["v*"]
concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
# Pin Bun so installs are reproducible (single source of truth + cache key).
env:
  BUN_VERSION: "1.3.14"
jobs:
  publish:
    name: publish to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # publish @mkm29/uds-headlamp-plugin to GitHub Packages
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
          no-cache: true # disable setup-bun's default cache (cache-poisoning vector in a publish job)
      # No dependency cache here on purpose: this job runs only on a release tag,
      # so a cache buys little, and caching in a package-publishing job is a
      # supply-chain (cache-poisoning) vector -- see zizmor cache-poisoning audit.
      - run: bun install --frozen-lockfile
      # The checked-out tag carries the release version in package.json (bumped by
      # release-please), so the built dist and the published version stay in sync.
      - name: Build plugin
        run: bun run build
      # Write auth into a workspace .npmrc (ephemeral runner, not cached). The
      # token comes in via env and is quoted -- no untrusted input, no injection.
      # publishConfig.registry in package.json points bun at GitHub Packages.
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '@mkm29:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > .npmrc
          bun publish
